name: lab7-ci
services:
  jenkins:
    build: ./jenkins
    image: lab7-jenkins-maven:local
    container_name: lab7-jenkins
    ports: ["${JENKINS_PORT:-8090}:8080"]
    volumes: ["jenkins_home:/var/jenkins_home"]
    restart: unless-stopped
    networks: [ci-network]
  nexus:
    image: sonatype/nexus3:latest
    container_name: lab7-nexus
    ports: ["${NEXUS_PORT:-8081}:8081"]
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms1024m -Xmx1024m -XX:MaxDirectMemorySize=1024m -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
    volumes: ["nexus_data:/nexus-data"]
    restart: unless-stopped
    networks: [ci-network]
  sonarqube:
    image: sonarqube:community
    container_name: lab7-sonarqube
    ports: ["${SONAR_PORT:-9000}:9000"]
    # Disposable local lab with embedded DB, as in the assignment. Not production.
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ulimits:
      nofile: {soft: 131072, hard: 131072}
      nproc: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped
    networks: [ci-network]
volumes:
  jenkins_home:
  nexus_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
networks:
  ci-network:
    driver: bridge
